name: build-validation.yml

on:
  pull_request:
    branches: [develop]

jobs:
  docker-build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo principal
        uses: actions/checkout@v4

      - name: Clonar repo do database
        run: |
          git clone https://github.com/noharm-nutricao/nutricao-database.git database

      - name: Build containers
        run: docker compose -f docker-compose.ci.yml build

      - name: Subir stack
        run: docker compose -f docker-compose.ci.yml up -d

      - name: Mostrar containers
        run: docker compose -f docker-compose.ci.yml ps

      - name: Aguardar API
        run: |
          for i in {1..40}; do
            if curl -fsS http://localhost:5000/nutritional/healthz; then
              echo "API respondeu com sucesso"
              exit 0
            fi

            echo "Aguardando API subir... tentativa $i"
            docker compose -f docker-compose.ci.yml ps
            sleep 5
          done

          echo "API não respondeu. Exibindo logs:"
          docker compose -f docker-compose.ci.yml logs
          exit 1

      - name: Derrubar
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

      - name: Logs em caso de falha
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs