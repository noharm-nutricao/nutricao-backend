name: CI - SonarCloud

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  sonar:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: noharm
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # necessário para o SonarCloud analisar o histórico completo

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          git clone https://github.com/noharm-ai/database
          psql -h localhost -U postgres -d noharm -f database/noharm-public.sql   -v ON_ERROR_STOP=1
          psql -h localhost -U postgres -d noharm -f database/noharm-create.sql   -v ON_ERROR_STOP=1
          psql -h localhost -U postgres -d noharm -f database/noharm-newuser.sql  -v ON_ERROR_STOP=1
          psql -h localhost -U postgres -d noharm -f database/noharm-triggers.sql -v ON_ERROR_STOP=1
          psql -h localhost -U postgres -d noharm -f database/noharm-insert.sql   -v ON_ERROR_STOP=1

      - name: Run tests with coverage
        env:
          ENV: test
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: noharm
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: |
          pip install pytest pytest-cov
          pytest --cov=. --cov-report=xml:coverage.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
