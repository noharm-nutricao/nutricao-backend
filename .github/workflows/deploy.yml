name: Pipeline

on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

env:
  AWS_REGION: us-east-2
  PROJECT_NAME: nitra-lambda

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.build_and_push.outputs.image_uri }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: infra
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=nitra-lambda/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}"

      - name: Garantir ECR
        working-directory: infra
        run: |
          terraform apply -auto-approve \
            -target=aws_ecr_repository.app \
            -var="aws_region=${{ secrets.AWS_REGION }}" \
            -var="project_name=${{ env.PROJECT_NAME }}" \
            -var="image_uri=dummy" \
            -var="db_host=${{ secrets.DB_HOST }}" \
            -var="db_name=${{ secrets.DB_NAME }}" \
            -var="db_user=${{ secrets.DB_USER }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="api_key=${{ secrets.API_KEY }}"

      - name: Login no ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build e push da imagem
        id: build_and_push
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$PROJECT_NAME:$IMAGE_TAG"

          echo "Buildando imagem: $IMAGE_URI"

          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Validar image_uri gerada
        run: |
          if [ -z "${{ steps.build_and_push.outputs.image_uri }}" ]; then
            echo "Build nao produziu image_uri."
            exit 1
          fi

          echo "image_uri=${{ steps.build_and_push.outputs.image_uri }}"

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clonar repo do database
        run: |
          git clone --branch develop https://github.com/noharm-nutricao/nutricao-database.git database

      - name: Build containers
        run: docker compose -f docker-compose.ci.yml build

      - name: Subir stack
        run: docker compose -f docker-compose.ci.yml up -d

      - name: Healthcheck da API
        run: |
          for i in {1..40}; do
            if curl -fsS http://localhost:5000/nutritional/healthz; then
              echo "API respondeu com sucesso"
              exit 0
            fi

            echo "Aguardando API subir... tentativa $i"
            docker compose -f docker-compose.ci.yml ps
            sleep 5
          done

          echo "API não respondeu. Exibindo logs:"
          docker compose -f docker-compose.ci.yml logs
          exit 1

      - name: Logs em caso de falha
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs

      - name: Derrubar stack
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs:
      - build
      - test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: infra
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=nitra-lambda/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}"

      - name: Criar ou atualizar Lambda com Terraform
        working-directory: infra
        run: |
          if [ -z "${{ needs.build.outputs.image_uri }}" ]; then
            echo "Output image_uri do job build veio vazio."
            exit 1
          fi

          terraform apply -auto-approve \
            -var="aws_region=${{ secrets.AWS_REGION }}" \
            -var="project_name=${{ env.PROJECT_NAME }}" \
            -var="image_uri=${{ needs.build.outputs.image_uri }}" \
            -var="db_host=${{ secrets.DB_HOST }}" \
            -var="db_name=${{ secrets.DB_NAME }}" \
            -var="db_user=${{ secrets.DB_USER }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="api_key=${{ secrets.API_KEY }}"

      - name: Aguardar Lambda ficar atualizada
        run: |
          aws lambda wait function-updated \
            --function-name "$PROJECT_NAME"

  post-deploy:
    name: Post-Deploy
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Publica nova versão
        id: publish
        run: |
          VERSION=$(aws lambda publish-version \
            --function-name "$PROJECT_NAME" \
            --query 'Version' \
            --output text)

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Nova versão publicada: $VERSION"

      - name: Testa nova versão antes de trocar tráfego
        run: |
          cat > payload.json << 'EOF'
          {
            "version": "2.0",
            "routeKey": "$default",
            "rawPath": "/nutritional/healthz",
            "rawQueryString": "",
            "headers": {
              "content-type": "application/json",
              "host": "localhost"
            },
            "requestContext": {
              "http": {
                "method": "GET",
                "path": "/nutritional/healthz",
                "sourceIp": "127.0.0.1",
                "userAgent": "github-actions"
              }
            },
            "body": null,
            "isBase64Encoded": false
          }
          EOF

          aws lambda invoke \
            --function-name "$PROJECT_NAME:${{ steps.publish.outputs.version }}" \
            --cli-binary-format raw-in-base64-out \
            --payload file://payload.json \
            --log-type Tail \
            response.json \
            > invoke-output.json

          echo "=============================="
          echo "Invoke output"
          echo "=============================="
          cat invoke-output.json | jq .

          echo "=============================="
          echo "Lambda response"
          echo "=============================="
          cat response.json | jq . || cat response.json

          LOG_RESULT=$(jq -r '.LogResult // empty' invoke-output.json)

          if [ -n "$LOG_RESULT" ]; then
            echo "=============================="
            echo "Lambda logs"
            echo "=============================="
            echo "$LOG_RESULT" | base64 -d || true
          fi

          if jq -e '.FunctionError' invoke-output.json > /dev/null; then
            echo "Lambda executou com erro."
            echo "Resposta:"
            cat response.json
            exit 1
          fi

          STATUS_CODE=$(jq -r '.statusCode // empty' response.json)

          if [ "$STATUS_CODE" != "200" ]; then
            echo "Healthcheck falhou."
            echo "Status recebido: $STATUS_CODE"
            echo "Resposta:"
            cat response.json
            exit 1
          fi

          echo "Healthcheck OK na versão ${{ steps.publish.outputs.version }}"

      - name: Promover alias live para nova versão
        run: |
          if aws lambda get-alias \
            --function-name "$PROJECT_NAME" \
            --name live > /dev/null 2>&1; then

            echo "Alias live já existe. Atualizando..."

            aws lambda update-alias \
              --function-name "$PROJECT_NAME" \
              --name live \
              --function-version "${{ steps.publish.outputs.version }}"

          else
            echo "Alias live não existe. Criando..."

            aws lambda create-alias \
              --function-name "$PROJECT_NAME" \
              --name live \
              --function-version "${{ steps.publish.outputs.version }}"
          fi

          echo "Alias live apontando para versão ${{ steps.publish.outputs.version }}"
