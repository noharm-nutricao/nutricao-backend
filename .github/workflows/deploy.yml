name: Deploy Lambda Docker

on:
  push:
    branches:
      - main
      - infra/terraform-backend
      - develop

permissions:
  contents: read

env:
  AWS_REGION: us-east-2
  PROJECT_NAME: nitra-lambda

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: infra
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=nitra-lambda/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}"

      - name: Criar ECR primeiro
        working-directory: infra
        run: |
          terraform apply -auto-approve \
            -target=aws_ecr_repository.app \
            -var="aws_region=${{ secrets.AWS_REGION }}" \
            -var="project_name=${{ env.PROJECT_NAME }}" \
            -var="image_uri=dummy" \
            -var="db_host=${{ secrets.DB_HOST }}" \
            -var="db_name=${{ secrets.DB_NAME }}" \
            -var="db_user=${{ secrets.DB_USER }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}"

      - name: Login no ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build e push da imagem
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$PROJECT_NAME:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$PROJECT_NAME:$IMAGE_TAG

      - name: Criar ou atualizar Lambda com Terraform
        working-directory: infra
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          terraform apply -auto-approve \
            -var="aws_region=${{ secrets.AWS_REGION }}" \
            -var="project_name=${{ env.PROJECT_NAME }}" \
            -var="image_uri=$ECR_REGISTRY/$PROJECT_NAME:$IMAGE_TAG" \
            -var="db_host=${{ secrets.DB_HOST }}" \
            -var="db_name=${{ secrets.DB_NAME }}" \
            -var="db_user=${{ secrets.DB_USER }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}"

      - name: Publica nova versão
        id: publish
        run: |
          VERSION=$(aws lambda publish-version \
            --function-name $PROJECT_NAME \
            --query 'Version' \
            --output text)

          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Testa nova versão antes de trocar tráfego
        run: |
          cat > payload.json << 'EOF'
          {
            "version": "2.0",
            "routeKey": "$default",
            "rawPath": "/nutritional/healthz",
            "rawQueryString": "",
            "headers": {
              "content-type": "application/json"
            },
            "requestContext": {
              "http": {
                "method": "GET",
                "path": "/nutritional/healthz",
                "sourceIp": "127.0.0.1"
              }
            },
            "isBase64Encoded": false
          }
          EOF

          aws lambda invoke \
            --function-name $PROJECT_NAME:${{ steps.publish.outputs.version }} \
            --cli-binary-format raw-in-base64-out \
            --payload file://payload.json \
            response.json

          cat response.json

          grep -q "200" response.json

      - name: Promove alias live para nova versão
        run: |
          aws lambda update-alias \
            --function-name $PROJECT_NAME \
            --name live \
            --function-version ${{ steps.publish.outputs.version }}