name: Deploy Lambda Docker

on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

env:
  AWS_REGION: us-east-2
  PROJECT_NAME: nitra-lambda

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: infra
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=nitra-lambda/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}"

      - name: Criar ECR primeiro
        working-directory: infra
        run: |
          terraform apply -auto-approve \
            -target=aws_ecr_repository.app \
            -var="aws_region=${{ secrets.AWS_REGION }}" \
            -var="project_name=${{ env.PROJECT_NAME }}" \
            -var="image_uri=dummy" \
            -var="db_host=${{ secrets.DB_HOST }}" \
            -var="db_name=${{ secrets.DB_NAME }}" \
            -var="db_user=${{ secrets.DB_USER }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}"

      - name: Login no ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build e push da imagem
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$PROJECT_NAME:$IMAGE_TAG"

          echo "Buildando imagem: $IMAGE_URI"

          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Criar ou atualizar Lambda com Terraform
        working-directory: infra
        run: |
          terraform apply -auto-approve \
            -var="aws_region=${{ secrets.AWS_REGION }}" \
            -var="project_name=${{ env.PROJECT_NAME }}" \
            -var="image_uri=${{ env.IMAGE_URI }}" \
            -var="db_host=${{ secrets.DB_HOST }}" \
            -var="db_name=${{ secrets.DB_NAME }}" \
            -var="db_user=${{ secrets.DB_USER }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}"

      - name: Aguarda Lambda ficar atualizada
        run: |
          aws lambda wait function-updated \
            --function-name "$PROJECT_NAME"

      - name: Publica nova versão
        id: publish
        run: |
          VERSION=$(aws lambda publish-version \
            --function-name "$PROJECT_NAME" \
            --query 'Version' \
            --output text)

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Nova versão publicada: $VERSION"

      - name: Testa nova versão antes de trocar tráfego
        run: |
          cat > payload.json << 'EOF'
          {
            "version": "2.0",
            "routeKey": "$default",
            "rawPath": "/nutritional/healthz",
            "rawQueryString": "",
            "headers": {
              "content-type": "application/json",
              "host": "localhost"
            },
            "requestContext": {
              "http": {
                "method": "GET",
                "path": "/nutritional/healthz",
                "sourceIp": "127.0.0.1",
                "userAgent": "github-actions"
              }
            },
            "body": null,
            "isBase64Encoded": false
          }
          EOF

          aws lambda invoke \
            --function-name "$PROJECT_NAME:${{ steps.publish.outputs.version }}" \
            --cli-binary-format raw-in-base64-out \
            --payload file://payload.json \
            --log-type Tail \
            response.json \
            > invoke-output.json

          echo "=============================="
          echo "Invoke output"
          echo "=============================="
          cat invoke-output.json | jq .

          echo "=============================="
          echo "Lambda response"
          echo "=============================="
          cat response.json | jq . || cat response.json

          LOG_RESULT=$(jq -r '.LogResult // empty' invoke-output.json)

          if [ -n "$LOG_RESULT" ]; then
            echo "=============================="
            echo "Lambda logs"
            echo "=============================="
            echo "$LOG_RESULT" | base64 -d || true
          fi

          if jq -e '.FunctionError' invoke-output.json > /dev/null; then
            echo "Lambda executou com erro."
            echo "Resposta:"
            cat response.json
            exit 1
          fi

          STATUS_CODE=$(jq -r '.statusCode // empty' response.json)

          if [ "$STATUS_CODE" != "200" ]; then
            echo "Healthcheck falhou."
            echo "Status recebido: $STATUS_CODE"
            echo "Resposta:"
            cat response.json
            exit 1
          fi

          echo "Healthcheck OK na versão ${{ steps.publish.outputs.version }}"

      - name: Promove alias live para nova versão
        run: |
          if aws lambda get-alias \
            --function-name "$PROJECT_NAME" \
            --name live > /dev/null 2>&1; then

            echo "Alias live já existe. Atualizando..."

            aws lambda update-alias \
              --function-name "$PROJECT_NAME" \
              --name live \
              --function-version "${{ steps.publish.outputs.version }}"

          else
            echo "Alias live não existe. Criando..."

            aws lambda create-alias \
              --function-name "$PROJECT_NAME" \
              --name live \
              --function-version "${{ steps.publish.outputs.version }}"
          fi

          echo "Alias live apontando para versão ${{ steps.publish.outputs.version }}"